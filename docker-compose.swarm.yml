version: '3.8'

services:
  # Traefik - Proxy Reverso e Balanceamento de Carga
  traefik:
    image: traefik:v3.0
    command:
      - "--providers.docker=true"
      - "--providers.docker.swarmMode=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    deploy:
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  # Banco de Dados PostgreSQL com extensão pgvector
  postgres:
    image: ankane/pgvector:latest
    environment:
      POSTGRES_DB: zap_zap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - db_password
    deploy:
      restart_policy:
        condition: on-failure

  # Redis para chaves de sessão e locks distribuídos
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    deploy:
      restart_policy:
        condition: on-failure

  # RabbitMQ Broker para mensageria de webhooks
  rabbitmq:
    image: rabbitmq:3-management-alpine
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    deploy:
      restart_policy:
        condition: on-failure

  # Express REST API (Escrita única para evitar conflitos de sessão do Signal)
  api:
    image: zap-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api.prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://postgres:db_password_placeholder@postgres:5432/zap_zap
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
      LOG_LEVEL: info
    deploy:
      replicas: 1 # Obrigatório 1 réplica (Single-Writer) devido ao Signal Protocol
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.api.rule=Host(`api.zap.local`)"
        - "traefik.http.routers.api.entrypoints=web"
        - "traefik.http.services.api.loadbalancer.server.port=3000"

  # Webhook & RAG Worker (Stateless, escalável horizontalmente)
  worker:
    image: zap-worker:latest
    build:
      context: .
      dockerfile: Dockerfile.worker.prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:db_password_placeholder@postgres:5432/zap_zap
      RABBITMQ_URL: amqp://rabbitmq:5672
      LOG_LEVEL: info
      PORT: 3000 # Necessário para ler porta da API nos requests locais
      AI_PROVIDER: gemini
      GEMINI_API_KEY: gemini_api_key_placeholder
    deploy:
      replicas: 2 # Pode ser escalado horizontalmente sem limitações
      restart_policy:
        condition: on-failure

  # Frontend Dashboard (Nginx estático)
  dashboard:
    image: zap-dashboard:latest
    build:
      context: .
      dockerfile: Dockerfile.dashboard.prod
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.dashboard.rule=Host(`dashboard.zap.local`)"
        - "traefik.http.routers.dashboard.entrypoints=web"
        - "traefik.http.services.dashboard.loadbalancer.server.port=80"

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:

secrets:
  db_password:
    external: true
